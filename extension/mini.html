<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Debrief controls</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: "Google Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #f5f4ff;
      background: linear-gradient(150deg, #2f2a8f 0%, #1e1b6b 55%, #14123f 100%); overflow: hidden; user-select: none; }
    #app { --dim: #aeaad6; --line: rgba(255,255,255,.14); --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --saffron: #ffb347;
      height: 100%; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 9px; }
    .top { display: flex; align-items: center; gap: 9px; }
    .rec { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: ring 1.6s infinite; flex: none; }
    .rec.idle { background: var(--dim); animation: none; }
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(251,113,133,.7); } 70% { box-shadow: 0 0 0 7px rgba(251,113,133,0); } 100% { box-shadow: 0 0 0 0 rgba(251,113,133,0); } }
    .title { font-weight: 700; font-size: 13.5px; }
    .title b { color: var(--saffron); }
    .time { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
    .eq { display: flex; gap: 2px; align-items: center; height: 15px; }
    .eq i { width: 3px; height: 4px; border-radius: 2px; background: var(--saffron); }
    .eq.live i { animation: eq 900ms ease-in-out infinite; }
    .eq.live i:nth-child(2) { animation-delay: -.3s; } .eq.live i:nth-child(3) { animation-delay: -.6s; } .eq.live i:nth-child(4) { animation-delay: -.15s; }
    .eq.dead i { background: var(--warn); }
    @keyframes eq { 0%,100% { height: 4px; } 50% { height: 14px; } }

    .mic { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border: 0; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 16px; font-weight: 750; letter-spacing: .01em; transition: transform .1s, filter .15s; }
    .mic:hover { filter: brightness(1.08); } .mic:active { transform: scale(.98); }
    .mic svg { width: 22px; height: 22px; flex: none; }
    .mic.on { background: linear-gradient(180deg, #34d399, #10b981); color: #052e22; box-shadow: 0 10px 22px -10px rgba(16,185,129,.9); }
    .mic.off { background: rgba(255,255,255,.1); color: #d6d3f5; border: 1px solid var(--line); }
    .mic.paused { background: linear-gradient(180deg, #fcd34d, #f59e0b); color: #3b2600; }
    .mic:disabled { opacity: .5; cursor: default; }
    .sub { text-align: center; color: var(--dim); font-size: 11.5px; margin-top: -3px; min-height: 15px; }

    .meters { display: flex; gap: 8px; }
    .m { flex: 1; }
    .m .l { display: flex; justify-content: space-between; color: var(--dim); font-size: 10.5px; margin-bottom: 3px; }
    .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #34d399, #6ee7b7); border-radius: 3px; transition: width .3s; }
    .bar i.low { background: var(--warn); } .bar i.dead { background: var(--bad); }

    .alert { padding: 8px 10px; border-radius: 11px; background: rgba(251,113,133,.16); border: 1px solid rgba(251,113,133,.55); font-size: 11.5px; line-height: 1.4; }
    .alert.key { background: rgba(251,191,36,.14); border-color: rgba(251,191,36,.55); }
    .alert strong { display: block; color: #ffd0d6; } .alert.key strong { color: #fde68a; }
    .row { display: flex; gap: 8px; margin-top: auto; }
    .btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: #f5f4ff; font: inherit; font-weight: 600; font-size: 12px; cursor: pointer; }
    .btn:hover { background: rgba(255,255,255,.15); }
    .btn.stop { flex: 1.4; border: 0; background: linear-gradient(180deg, #fb7185, #e11d48); }
    .hidden { display: none !important; }
    .idle-msg { margin: auto 0; text-align: center; color: var(--dim); line-height: 1.5; }
  </style>
</head>
<body>
  <div id="app">
    <div class="top"><span class="rec" id="rec"></span><span class="title">Debrief <b id="stateWord">idle</b></span><span class="eq" id="eq"><i></i><i></i><i></i><i></i></span><span class="time" id="time"></span></div>
    <div id="idle" class="idle-msg">Not recording.<br>Start from the Debrief icon or press <b>Alt+Shift+M</b> in your meeting.</div>
    <div id="live" class="hidden" style="display:flex;flex-direction:column;gap:9px;flex:1">
      <button class="mic on" id="mic" type="button"></button>
      <div class="sub" id="micSub"></div>
      <div class="meters">
        <div class="m"><div class="l"><span>Meeting</span><span id="tabT"></span></div><div class="bar"><i id="tabB"></i></div></div>
        <div class="m"><div class="l"><span>Mic</span><span id="micT"></span></div><div class="bar"><i id="micB"></i></div></div>
      </div>
      <div class="alert hidden" id="alert"><strong id="alertT"></strong><span id="alertD"></span></div>
      <div class="row"><button class="btn" id="pip" type="button" title="Keep these controls on top of every window">Keep on top</button><button class="btn stop" id="stop" type="button">Stop &amp; write MOM</button></div>
    </div>
  </div>
  <script src="dist/mini.js"></script>
</body>
</html>
