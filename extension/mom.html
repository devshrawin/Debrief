<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minutes of Meeting</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="print.css" media="print">
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
    header h1 { font-size: 20px; margin: 0; }
    header input { font-size: 20px; font-weight: 700; border-color: transparent; padding: 2px 4px; margin-left: -4px; }
    header input:hover, header input:focus { border-color: var(--border); }
    .meta { color: var(--muted); font-size: 13px; margin: 4px 0 12px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 16px 0 0; }
    .tabs button { border: none; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; }
    .tabs button.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
    .toolbar { margin: 12px 0; }
    #mom { padding: 4px 2px; min-height: 120px; }
    #mom table { border-collapse: collapse; width: 100%; margin: 8px 0; }
    #mom th, #mom td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
    #mom th { background: var(--panel); }
    #mdEdit { min-height: 480px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
    .transcript { font-size: 13px; }
    .seg { display: grid; grid-template-columns: 56px 110px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .seg .t { color: var(--muted); font-variant-numeric: tabular-nums; }
    .seg .who { font-weight: 600; }
    .seg .who.me { color: var(--accent); }
    details { margin-top: 12px; }
    #notes { min-height: 70px; }
    @media (max-width: 600px) { .seg { grid-template-columns: 48px 1fr; } .seg .text { grid-column: 1 / -1; } }
    @media print {
      .no-print, .tabs, .toolbar, details { display: none !important; }
      body { background: #fff; color: #000; }
    }
    .ask { margin: 14px 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
    .ask h3 { margin: 0 0 8px; font-size: 14px; }
    .ask-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .ask-row input { flex: 1; }
    .ask-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chipbtn { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
    .ask-log { margin-top: 10px; }
    .ask-turn { margin: 10px 0; }
    .ask-q { font-weight: 600; }
    .ask-a { margin: 4px 0 0 0; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 8px 8px 0; white-space: normal; }
    .ask-a p { margin: 4px 0; }
    .ask-src { margin-top: 6px; font-size: 12px; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand no-print" style="margin-bottom:12px;font-weight:600"><img src="icons/icon48.png" alt="" style="width:22px;height:22px;border-radius:5px">Debrief</div>
    <input id="title" aria-label="Meeting title">
    <div class="meta" id="meta"></div>
  </header>
  <div id="errors" class="warn hidden no-print"></div>
  <div id="pendingBox" class="warn row hidden no-print" style="margin-top:8px"><span id="pendingText" style="flex:1"></span><button id="retry">Retry transcription</button></div>

  <details class="no-print" id="notesBox">
    <summary>People, names and context (optional, improves the minutes)</summary>
    <label for="attendees">Who was in the meeting (one name per line)</label>
    <textarea id="attendees" rows="3" placeholder="Amal Raj&#10;Priya Nair"></textarea>
    <p class="hint">Used to fix misheard names (Aman becomes Amal when Amal is here and Aman is not) and to spell names exactly in the minutes.</p>
    <div id="suggest" class="hidden" style="margin:8px 0"></div>
    <label>Fix a name everywhere</label>
    <div class="row">
      <input id="fixWrong" placeholder="Heard as" aria-label="Heard as" style="max-width:180px">
      <input id="fixRight" placeholder="Should be" aria-label="Should be" style="max-width:180px">
      <button id="fixApply">Fix</button>
      <label style="margin:0;font-weight:400;display:flex;gap:6px;align-items:center;width:auto"><input type="checkbox" id="fixRemember" checked style="width:auto"> remember for next time</label>
      <span id="fixMsg" class="hint"></span>
    </div>
    <label for="notes">Other context for the minutes</label>
    <textarea id="notes" placeholder="e.g. Agenda, project name is spelled 'UR Masters'."></textarea>
  </details>

  <div class="tabs no-print">
    <button data-tab="momTab" class="active">Minutes</button>
    <button data-tab="trTab">Transcript</button>
  </div>

  <div id="momTab">
    <div class="toolbar row no-print">
      <button id="gen" class="primary">Generate MOM</button>
      <button id="reread" class="hidden" title="Read the transcript again from scratch instead of reusing the items found last time">Re-read transcript</button>
      <button id="abort" class="hidden">Stop</button>
      <span id="genStatus" class="hint"></span>
      <span id="mailStatus" class="hint"></span>
      <span style="flex:1"></span>
      <button id="edit">Edit</button>
      <button id="copy">Copy</button>
      <button id="dlMd">.md</button>
      <button id="dlDoc">Word</button>
      <button id="print">Print / PDF</button>
      <button id="mail" title="Send this MOM to your email">Email me</button>
    </div>
    <details class="no-print" id="shareBox" style="margin:10px 0">
      <summary>Share these minutes with others</summary>
      <p class="hint" id="shareSrc"></p>
      <textarea id="shareTo" rows="2" placeholder="priya@company.com, ravi@company.com"></textarea>
      <div class="row" style="margin-top:8px">
        <select id="shareHowSel" style="width:auto"><option value="to">To</option><option value="cc">Cc</option><option value="bcc">Bcc</option></select>
        <button id="shareInvited" class="hidden">Add everyone invited</button>
        <button id="shareAbsent" class="hidden">Add people who were absent</button>
        <button id="shareSend" class="primary">Share</button>
        <span id="shareStatus" class="hint"></span>
      </div>
    </details>
    <section id="askBox" class="no-print"></section>
    <article id="mom"><p class="muted">No minutes yet.</p></article>
    <textarea id="mdEdit" class="hidden"></textarea>
  </div>

  <div id="trTab" class="hidden">
    <div class="toolbar row no-print">
      <span id="trInfo" class="hint"></span>
      <span style="flex:1"></span>
      <button id="dlTxt">Download .txt</button>
      <button id="del" class="danger">Delete meeting</button>
    </div>
    <div class="transcript" id="transcript"></div>
  </div>
</main>
<script src="dist/mom.js"></script>
</body>
</html>
