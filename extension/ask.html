<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask your meetings · Debrief</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 820px; margin: 0 auto; padding: 28px 18px 80px; }
    h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
    .lede { color: var(--muted); margin: 0 0 18px; }
    .scope { display: flex; gap: 10px; align-items: center; margin: 0 0 12px; }
    .scope select { width: auto; }
    .ask { padding: 14px 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--panel); }
    .ask-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .ask-row input { flex: 1; }
    .ask-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chipbtn { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; }
    .ask-log { margin-top: 14px; }
    .ask-turn { margin: 14px 0; }
    .ask-q { font-weight: 650; }
    .ask-a { margin: 6px 0 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 10px 10px 0; }
    .ask-a p { margin: 5px 0; }
    .ask-src { margin-top: 8px; font-size: 12.5px; }
    .note { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1 class="brand"><img src="icons/icon48.png" alt=""><span>Ask your meetings</span></h1>
  <p class="lede">Ask a question and Debrief searches your minutes and transcripts and answers with the source of every point.</p>
  <div class="scope"><label for="scope" style="margin:0">Look in</label>
    <select id="scope"><option value="all">All meetings</option><option value="7">The last 7 days</option><option value="30">The last 30 days</option></select>
    <span class="hint" id="count"></span>
  </div>
  <div id="askBox"></div>
  <p class="note">Only the best-matching excerpts are sent to the model you chose for the minutes, the same service that writes them. Answers can be wrong: check the sources.</p>
</main>
<script src="dist/askpage.js"></script>
</body>
</html>
