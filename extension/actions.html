<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open actions · Debrief</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <script src="fx/theme.js"></script>
</head>
<body>
<main class="ac-main">
  <div class="crumb"><img src="icons/icon48.png" alt=""><b>Debrief</b><span class="hint" style="margin:0">/ Actions</span></div>
  <div class="ac-head">
    <h1>Open actions</h1>
    <p class="ac-counts" id="counts" role="status"></p>
  </div>
  <div class="ac-tools hidden" id="tools">
    <div class="seg-ctl" id="modes" role="radiogroup" aria-label="Group by">
      <button type="button" role="radio" aria-checked="false" data-mode="meeting">By meeting</button>
      <button type="button" role="radio" aria-checked="false" data-mode="owner">By owner</button>
      <button type="button" role="radio" aria-checked="false" data-mode="due">By due date</button>
    </div>
    <label class="sr-only" for="q">Filter by owner or text</label>
    <input id="q" type="search" placeholder="Filter by owner or text" autocomplete="off">
    <label class="ac-switch"><input type="checkbox" role="switch" id="showDone"><span>Show done</span></label>
  </div>
  <p class="ac-status" id="status" role="status" aria-live="polite"><span id="statusText"></span><button type="button" class="plain hidden" id="undo">Undo</button></p>
  <div id="list"></div>
</main>
<script src="dist/actionspage.js"></script>
</body>
</html>
