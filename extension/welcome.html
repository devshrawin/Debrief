<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome to Debrief</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <style>
    :root { --brand: #3a33a8; --brand-soft: #eceafc; --saffron: #ff7a1a; --card: #ffffff; --field: #f6f7f9; --ring: rgba(58,51,168,.28); --okc: #10b981; }
    @media (prefers-color-scheme: dark) { :root { --brand: #9d97ff; --brand-soft: #25234a; --card: #202328; --field: #1b1d21; --ring: rgba(157,151,255,.35); } }
    body { background: var(--field); }
    .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1080px; margin: 0 auto; min-height: 100vh; }
    .side { position: sticky; top: 0; align-self: start; height: 100vh; padding: 28px 16px; display: flex; flex-direction: column; }
    .logo { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; }
    .logo img { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 4px 12px -4px rgba(30,27,107,.5); }
    .logo b { display: block; font-size: 16px; line-height: 1.1; }
    .logo span { font-size: 12px; color: var(--muted); }
    .steps-nav { display: flex; flex-direction: column; gap: 2px; }
    .steps-nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 13.5px; cursor: pointer; }
    .steps-nav button:hover { background: var(--card); color: var(--text); }
    .steps-nav button.active { background: var(--brand-soft); color: var(--brand); }
    .steps-nav .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--border); color: var(--text); }
    .steps-nav button.active .dot { background: var(--brand); color: #fff; }
    .steps-nav button.done .dot { background: var(--okc); color: #fff; }
    .steps-nav .opt { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--muted); }
    .side .skipall { margin-top: auto; padding: 0 10px; font-size: 12px; }

    .content { padding: 32px 34px 120px; min-width: 0; }
    .kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--saffron); margin: 0 0 6px; }
    h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -.02em; }
    .lede { color: var(--muted); font-size: 15px; margin: 0 0 22px; max-width: 62ch; line-height: 1.55; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin: 0 0 16px; box-shadow: 0 1px 2px rgba(20,16,60,.04); }
    .card h2 { font-size: 15px; margin: 0 0 8px; }
    .card p { margin: 6px 0; line-height: 1.55; }
    .card .hint { color: var(--muted); font-size: 12.5px; }
    .card input:not([type=checkbox]), .card select, .card textarea { width: 100%; max-width: 480px; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--field); margin-top: 4px; }
    .card textarea { max-width: none; min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    .card input:focus, .card select:focus, .card textarea:focus { outline: 2px solid var(--ring); border-color: var(--brand); }
    .card label { display: block; font-weight: 600; font-size: 13.5px; margin: 12px 0 2px; }
    .btnrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .btn { padding: 8px 14px; border-radius: 9px; font-weight: 600; font-size: 13px; background: var(--card); border: 1px solid var(--border); cursor: pointer; }
    .btn:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
    .status { font-size: 13px; color: var(--muted); }
    .status.ok { color: #0a7d54; font-weight: 600; } .status.bad { color: #c0392b; font-weight: 600; }
    ol.how { margin: 8px 0 0; padding-left: 0; list-style: none; counter-reset: s; }
    ol.how li { position: relative; padding: 9px 0 9px 38px; border-top: 1px solid var(--border); line-height: 1.5; }
    ol.how li:first-child { border-top: 0; }
    ol.how li::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 9px; width: 24px; height: 24px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
    .card label.toggle { display: flex; font-weight: 400; margin: 0; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; }
    .toggle:first-of-type { border-top: 0; }
    .toggle .t b { display: block; font-weight: 600; font-size: 13.5px; }
    .toggle .t span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.45; }
    .toggle input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 38px; height: 22px; padding: 0; margin: 0 !important; max-width: none !important; border: 0 !important; border-radius: 999px; background: var(--border); cursor: pointer; transition: background .2s; }
    .toggle input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
    .toggle input:checked { background: var(--okc); } .toggle input:checked::after { transform: translateX(16px); }
    kbd { font: 12px ui-monospace, Consolas, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--card); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mini { background: var(--field); border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; }
    .mini b { display: block; margin-bottom: 3px; }
    .callout { padding: 12px 14px; border-radius: 12px; background: var(--brand-soft); font-size: 13.5px; line-height: 1.5; margin: 0 0 16px; }
    .checklist { list-style: none; padding: 0; margin: 0; }
    .checklist li { padding: 9px 0 9px 34px; border-top: 1px solid var(--border); position: relative; }
    .checklist li:first-child { border-top: 0; }
    .checklist li::before { content: ""; position: absolute; left: 0; top: 9px; width: 22px; height: 22px; border-radius: 50%; background: var(--border); }
    .checklist li.ok::before { content: "\2713"; background: var(--okc); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
    .checklist li .sub { color: var(--muted); font-size: 12.5px; display: block; }
    pre#script { max-height: 150px; overflow: auto; white-space: pre-wrap; background: var(--field); padding: 10px; border-radius: 9px; border: 1px solid var(--border); font-size: 11.5px; margin: 8px 0 0; }
    .nav { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--border); }
    .nav .in { display: flex; align-items: center; gap: 12px; max-width: 1080px; margin: 0 auto; padding: 12px 34px 12px calc(250px + 34px); }
    .nav .spacer { flex: 1; }
    .nav .count { color: var(--muted); font-size: 13px; }
    @media (max-width: 820px) { .shell { grid-template-columns: 1fr; } .side { position: static; height: auto; } .steps-nav { flex-direction: row; flex-wrap: wrap; } .steps-nav button { width: auto; } .side .skipall { display: none; } .content { padding: 20px 16px 120px; } .nav .in { padding: 12px 16px; } .grid2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo"><img src="icons/icon48.png" alt=""><div><b>Debrief</b><span>Quick tour</span></div></div>
    <nav class="steps-nav" id="stepsNav"></nav>
    <div class="skipall"><a href="#" id="skipAll">Skip the tour</a></div>
  </aside>
  <main class="content" id="stage"></main>
</div>
<div class="nav"><div class="in"><button class="btn" id="back">Back</button><span class="count" id="count"></span><span class="spacer"></span><button class="btn" id="skip">Skip this step</button><button class="btn primary" id="next">Next</button></div></div>
<script src="dist/welcome.js"></script>
</body>
</html>
