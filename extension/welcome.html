<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set up · Debrief</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <script src="fx/theme.js"></script>
  <style>
    /* Tour layout only. Tokens, buttons, .sw, .chip, .inp, .callout, .steps ... come from style.css. */
    .shell { display: flex; min-height: 100vh; }
    .rail { width: 288px; flex: none; position: sticky; top: 16px; height: calc(100vh - 32px); margin: 16px 0 16px 16px; overflow-y: auto; padding: 22px 16px; border-radius: var(--r-lg); background: var(--mat-thin); -webkit-backdrop-filter: var(--blur-thin); backdrop-filter: var(--blur-thin); box-shadow: var(--edge), var(--shadow-2); display: flex; flex-direction: column; gap: 18px; }
    .rail .brand { padding: 0 8px; }
    .rail .brand img { width: 30px; height: 30px; }
    .rail .brand strong { font-size: 16px; }
    .progress { padding: 0 8px; display: flex; flex-direction: column; gap: 6px; }
    .progress .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
    .bar { height: 6px; border-radius: 9px; background: var(--sunk); overflow: hidden; }
    .bar > div { height: 100%; background: var(--brand); border-radius: 9px; transition: width .25s; }
    .steps-nav { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
    .steps-nav button { width: 100%; min-height: 38px; justify-content: flex-start; gap: 10px; padding: 4px 8px; border: 0; border-radius: 9px; background: transparent; font-weight: 500; text-align: left; }
    .steps-nav button:hover { background: var(--sunk); }
    .steps-nav button[aria-current="step"] { background: var(--tint); color: var(--on-tint); font-weight: 650; }
    .steps-nav .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .steps-nav .opt { font-size: 11px; color: var(--muted); font-weight: 500; }
    .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: none; background: var(--card); color: var(--muted); border: 1px solid var(--line-strong); }
    .steps-nav [aria-current="step"] .num { background: rgb(255 255 255 / .22); color: var(--on-tint); border-color: transparent; }
    .steps-nav .isdone .num { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #skipAll { margin-top: auto; justify-content: flex-start; font-size: 13px; color: var(--tint); font-weight: 600; background: transparent; }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
    #stage { flex: 1; padding: 48px 64px 32px; }
    .wrap { max-width: 720px; display: flex; flex-direction: column; gap: 20px; }
    .wrap h1 { margin: 6px 0 6px; font-size: 32px; line-height: 1.2; letter-spacing: -0.015em; overflow-wrap: anywhere; }
    .wrap h1:focus { outline: none; }
    .kicker { color: var(--brand); }
    .lede { margin: 0; font-size: 16px; color: var(--muted); overflow-wrap: anywhere; }
    .wrap .card { padding: 24px; display: flex; flex-direction: column; gap: 14px; overflow-wrap: anywhere; }
    .wrap .card.tight { padding: 8px 24px; gap: 0; }
    .wrap .card p { margin: 0; }
    .wrap .card p.hint { margin: 0; }
    .wrap .card h2 { margin: 0; }
    .fld { display: flex; flex-direction: column; gap: 6px; }
    .fld > label, .trow label { margin: 0; }
    textarea.inp { min-height: 0; }
    .rowf { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
    .rowf > .inp { flex: 1; min-width: 200px; width: auto; }
    .btnrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }
    .status.ok { color: var(--ok); font-weight: 600; }
    .status.bad { color: var(--rec-ink); font-weight: 600; }
    .status:empty { display: none; }
    .trow { display: flex; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .trow:first-child { border-top: 0; }
    .trow .t { flex: 1; min-width: 200px; }
    .trow .t strong { display: block; font-weight: 600; }
    .trow .t .hint { margin-top: 2px; }
    .trow select.inp { width: 250px; max-width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    label.chip { position: relative; margin: 0; min-height: 36px; padding: 6px 14px; background: var(--card); cursor: pointer; user-select: none; font-weight: 600; }
    label.chip:hover { background: var(--sunk); }
    label.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; padding: 0; min-height: 0; pointer-events: none; }
    label.chip:has(input:checked) { background: var(--tint-soft); color: var(--tint); border-color: var(--brand); }
    label.chip:has(input:checked)::before { content: "\2713"; font-size: 11px; }
    label.chip:has(input:focus-visible) { outline: 2px solid var(--focus-color); outline-offset: 2px; }
    .wrap .steps li::before { background: var(--tint-soft); color: var(--tint); border-color: transparent; }
    .wrap .steps li { margin: 0; }
    .wrap .steps { display: flex; flex-direction: column; gap: 10px; }
    .tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .tiles li { display: flex; flex-direction: column; gap: 10px; }
    .tile { height: 84px; border-radius: 12px; background: var(--sunk); display: grid; place-items: center; }
    .tile svg { stroke: var(--brand); }
    .bul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
    .promise { flex-direction: row !important; align-items: flex-start; gap: 16px !important; }
    .promise svg { flex: none; stroke: var(--ok); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mini { background: var(--sunk); border: 1px solid var(--line); border-radius: 11px; padding: 12px 14px; }
    .mini b { display: block; margin-bottom: 3px; }
    .callout svg { flex: none; margin-top: 2px; }
    .callout p { margin: 0; }
    input.inp[aria-invalid="false"].okf { border-color: var(--ok); }
    .vmsg { font-size: 12.5px; margin: 0; color: var(--muted); }
    .vmsg.ok { color: var(--ok); font-weight: 600; }
    .vmsg.bad { color: var(--rec-ink); font-weight: 600; }
    .checklist { list-style: none; margin: 0; padding: 8px 24px; }
    .checklist li { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
    .checklist li:first-child { border-top: 0; }
    .checklist li::before, .checklist li.ok::before { content: none; display: none; }
    .checklist .num { background: var(--sunk); color: var(--muted); }
    .checklist li.ok .num { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-line); }
    .checklist .txt { flex: 1; min-width: 0; }
    .checklist .sub { display: block; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
    .wrap .card.checkcard { padding: 0; }
    pre#script { max-height: 150px; overflow: auto; }

    /* Back / Skip / Next float as a glass capsule over the page instead of a full-width strip */
    .foot { position: sticky; bottom: 16px; margin: 0 64px 16px; padding: 8px 8px 8px 12px; border-radius: var(--r-pill); background: var(--mat-thick); -webkit-backdrop-filter: var(--blur-thick); backdrop-filter: var(--blur-thick); box-shadow: var(--edge), var(--shadow-3); display: flex; align-items: center; gap: 12px; }
    .foot .spacer { flex: 1; }
    #next { min-width: 140px; min-height: 40px; }
    #back, #skip { min-height: 40px; }
    #skip { color: var(--muted); }

    @media (max-width: 900px) {
      .shell { flex-direction: column; }
      .rail { position: static; width: auto; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; gap: 12px; }
      .steps-nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .steps-nav button { width: auto; padding: 4px; }
      .steps-nav li:not(.cur) .nm, .steps-nav li .opt { display: none; }
      .steps-nav li.cur .nm { padding-right: 8px; }
      #skipAll { margin-top: 0; }
      main { min-height: 0; }
      #stage { padding: 24px 16px; }
      .wrap h1 { font-size: 26px; }
      .wrap .card { padding: 18px 16px; }
      .wrap .card.tight { padding: 4px 16px; }
      .checklist { padding: 4px 16px; }
      .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cols { grid-template-columns: 1fr; }
      .foot { margin: 0 12px 12px; }
    }
    @media (max-width: 480px) { .tiles { grid-template-columns: 1fr; } .foot { flex-wrap: wrap; } #next { flex: 1; } }
  </style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Tour steps">
    <div class="brand"><img src="icons/icon48.png" alt=""><div><strong>Debrief</strong><span class="tag">Quick tour</span></div></div>
    <div class="progress">
      <div class="meta"><span id="count"></span><span id="left"></span></div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1" aria-label="Tour progress"><div id="barfill" style="width: 8%"></div></div>
    </div>
    <ol class="steps-nav" id="stepsNav"></ol>
    <button class="ghost" id="skipAll" type="button">Skip the tour, I'll set up later</button>
  </nav>
  <main>
    <div id="stage"></div>
    <footer class="foot">
      <button class="btn" id="back" type="button">Back</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="skip" type="button">Skip this step</button>
      <button class="btn primary" id="next" type="button">Next</button>
    </footer>
  </main>
</div>
<script src="dist/welcome.js"></script>
</body>
</html>
